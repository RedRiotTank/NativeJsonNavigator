name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (Java ${{ matrix.java }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [22, 25]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify (tests, JaCoCo, SpotBugs, japicmp, JPMS)
        run: ./mvnw -B -ntp verify -e

      - name: Dump surefire reports on failure
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            if [ -f "$f" ]; then
              echo "=== $f ==="
              cat "$f"
            fi
          done

      - name: Validate release scripts
        if: matrix.os == 'ubuntu-latest' && matrix.java == '22'
        run: |
          bash -n scripts/release.sh
          bash -n scripts/validate-release.sh
          ./scripts/release.sh --help > /dev/null
          ./scripts/validate-release.sh --help > /dev/null
